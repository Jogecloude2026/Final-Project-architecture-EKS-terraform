name: terraform deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      destroy:
        description: "Tick to DESTROY all infrastructure"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-eks
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  init:
    name: terraform init & validate
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        run: terraform init
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: terraform validate

  tfsec:
    name: security scan (tfsec) Phase(1)
    needs: [init]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true

  sonar-scan:
    name: security scan (sonar-scan) Phase(2)
    needs: [tfsec]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=Terraform-final-project
            -Dsonar.projectName="Terraform-final-project"
            -Dsonar.exclusions=**/.terraform/**,**/*.tfstate
            -Dsonar.qualitygate.wait=true

  plan-apply:
    name: terraform plan and apply
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        run: terraform init
      - name: terraform plan
        run: terraform plan -out=tfplan
      - name: terraform apply
        run: terraform apply -auto-approve tfplan

  destroy:
    name: terraform destroy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.destroy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Clean up Kubernetes-created resources
        continue-on-error: true
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name jogecloud-eks
          timeout 300 kubectl delete applications --all -n argocd --wait=true || true
          kubectl delete ingress --all -A --timeout=120s || true
          kubectl delete pvc --all -A --timeout=120s || true
          sleep 90
      - name: terraform init
        run: terraform init
      - name: terraform destroy
        run: terraform destroy -auto-approve
